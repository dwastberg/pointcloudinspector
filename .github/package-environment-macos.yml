name: pcinspector-package

channels:
  - conda-forge

dependencies:
  - clang-format=22.1.8
  - cmake>=3.30
  # libc++ 19 keeps std::jthread behind its experimental-library switch.
  # Use the native ARM64 Clang 22 toolchain, whose libc++ implements all of
  # the C++20/C++23 library features used by the application.
  - clangxx_osx-arm64=22.*
  - libgdal-core>=3.9
  - libpdal>=2.10
  - ninja
  - qt6-main>=6.10
