name: Package Linux Flatpak

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      expected_version:
        description: CMake version required by the release workflow
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}

    steps:
      - name: Check out source and test dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Read CMake project version
        id: version
        shell: bash
        run: |
          version="$(bash scripts/release.sh version "$EXPECTED_VERSION")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak and run non-GPU tests
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PointCloudInspector-${{ steps.version.outputs.value }}-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.dwastberg.PointCloudInspector.yml
          branch: stable
          run-tests: true
          keep-build-dirs: true
          upload-artifact: false

      - name: Verify packaged GDAL capabilities
        run: |
          # The Flatpak runtime ships its own GDAL. Prove it can open catalogs
          # here rather than leaving it for a user to discover.
          flatpak run io.github.dwastberg.PointCloudInspector \
            --gdal-capabilities

      - name: Create package checksum
        shell: bash
        run: |
          package="PointCloudInspector-${{ steps.version.outputs.value }}-linux-x86_64.flatpak"
          sha256sum "$package" > "$package.sha256"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: PointCloudInspector-${{ steps.version.outputs.value }}-linux-x86_64
          overwrite: true
          path: |
            *.flatpak
            *.flatpak.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Record Flatpak SDK and runtime
        if: always()
        shell: bash
        run: |
          mkdir -p build/flatpak-diagnostics
          {
            flatpak --version
            flatpak list --runtime --columns=application,branch,arch,active:full
          } > build/flatpak-diagnostics/environment.txt 2>&1

      - name: Retain Flatpak build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak-diagnostics
          overwrite: true
          include-hidden-files: true
          path: |
            build/flatpak-diagnostics/
            .flatpak-builder/build/**/CMakeCache.txt
            .flatpak-builder/build/**/CMakeFiles/*/CMakeCXXCompiler.cmake
            .flatpak-builder/build/**/CMakeFiles/CMakeConfigureLog.yaml
            .flatpak-builder/build/**/compile_commands.json
            .flatpak-builder/build/**/Testing/**
