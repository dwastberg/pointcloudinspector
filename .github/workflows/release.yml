name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check tag against CMake project version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(bash scripts/release.sh version "${RELEASE_TAG#v}")"
          test "$RELEASE_TAG" = "v$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows package
    needs: validate
    uses: ./.github/workflows/package-windows.yml
    with:
      expected_version: ${{ needs.validate.outputs.version }}

  macos:
    name: macOS package
    needs: validate
    uses: ./.github/workflows/package-macos.yml
    with:
      expected_version: ${{ needs.validate.outputs.version }}

  linux:
    name: Linux package
    needs: validate
    uses: ./.github/workflows/package-linux-flatpak.yml
    with:
      expected_version: ${{ needs.validate.outputs.version }}

  publish:
    name: Verify assets and publish release
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Windows installer and checksum
        uses: actions/download-artifact@v8
        with:
          name: PointCloudInspector-${{ needs.validate.outputs.version }}-windows-x64
          path: dist/release
      - name: Download macOS installer and checksum
        uses: actions/download-artifact@v8
        with:
          name: PointCloudInspector-${{ needs.validate.outputs.version }}-macOS-arm64
          path: dist/release
      - name: Download Linux installer and checksum
        uses: actions/download-artifact@v8
        with:
          name: PointCloudInspector-${{ needs.validate.outputs.version }}-linux-x86_64
          path: dist/release
      - name: Verify packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          bash scripts/release.sh publish
          "$RELEASE_TAG" "$GITHUB_REPOSITORY" dist/release
