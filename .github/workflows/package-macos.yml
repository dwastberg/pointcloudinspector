name: Package macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out source and test dependencies
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = arm64

      - name: Select C++23-capable Xcode SDK
        run: |
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$xcode_app"
          developer_dir="$xcode_app/Contents/Developer"
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcrun clang++ --version
          DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-path

      - name: Install build dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/package-environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Verify C++23 standard library
        run: |
          test -n "${CXX:-}"
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          "$CXX" --version
          printf '%s\n' \
            '#include <expected>' \
            'static_assert(__cpp_lib_expected >= 202202L);' \
            'int main() { std::expected<int, int> value = 42; return value.value(); }' |
            "$CXX" -isysroot "$sdk_path" -mmacosx-version-min=15.0 \
              -std=c++23 -x c++ -fsyntax-only -

      - name: Configure release package
        run: |
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          cmake --preset package -G Ninja \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_SYSROOT="$sdk_path"

      - name: Build with warnings as errors
        run: cmake --build --preset package --parallel 3

      - name: Run non-GPU tests
        run: ctest --preset package

      - name: Install and create unsigned DMG
        id: package
        run: |
          install_root="$PWD/dist/macos"
          dmg_root="$PWD/dist/dmg-root"
          app="$install_root/Point Cloud Inspector.app"
          version="$(tr -d '\r\n' < build/package/pcinspector-version.txt)"

          cmake --install build/package --config Release --prefix "$install_root"
          test -d "$app"

          # Bundle fixup modifies and adds third-party libraries after Qt's
          # deployment step, so sign the completed bundle from the inside out.
          bash packaging/macos/adhoc-sign.sh "$app"

          mkdir -p "$dmg_root"
          ditto "$app" "$dmg_root/Point Cloud Inspector.app"
          cp README.md LICENSE "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"

          package="PointCloudInspector-${version}-macOS-arm64.dmg"
          hdiutil create \
            -volname "Point Cloud Inspector ${version}" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "dist/$package"
          (cd dist && shasum -a 256 "$package" > "$package.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PointCloudInspector-${{ steps.package.outputs.version }}-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          compression-level: 0
          if-no-files-found: error
