name: CI Linux

on:
  workflow_dispatch:
    inputs:
      run_long_stress_tests:
        description: Include full-scale stress tests
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PCINSPECTOR_LONG_STRESS: ${{ inputs.run_long_stress_tests && 'ON' || 'OFF' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: ci
            label: GCC Debug
          - preset: ci-release
            label: GCC Release
    env:
      CI_PRESET: ${{ matrix.preset }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out source and test dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Configure, verify GCC, build, and test (formatting in Debug)
        run: bash scripts/run-linux-ci.sh "$CI_PRESET"

      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.preset }}-diagnostics
          overwrite: true
          path: build/${{ matrix.preset }}/Testing/

  flatpak:
    name: Linux Flatpak SDK build and tests
    uses: ./.github/workflows/package-linux-flatpak.yml
