name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out source and test dependencies
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Configure
        run: cmake --preset ci -G Ninja

      - name: Build with warnings as errors
        run: cmake --build --preset ci --parallel 3

      - name: Check C++ formatting
        run: cmake --build --preset ci --target format-check

      - name: Verify qualification test registration
        run: cmake -DBUILD_DIR=build/ci -DCTEST_CONFIGURATION=Debug -P tests/cmake/CheckQualificationTestRegistration.cmake

      - name: Run qualification diff contract tests
        run: ctest --preset ci -R '^qualification_diff_' --output-on-failure --no-tests=error

      - name: Run non-GPU tests
        run: ctest --preset ci

  windows:
    name: Windows build and tests
    needs: [linux, linux-validation]
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source and test dependencies
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: powershell

      - name: Configure and build with MSVC
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installationPath) {
            throw "A Visual Studio installation with the MSVC x64 tools was not found."
          }

          $devShell = Join-Path $installationPath "Common7\Tools\Launch-VsDevShell.ps1"
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $env:CXX = "cl.exe"
          cmake --preset ci-windows -G Ninja
          cmake --build --preset ci-windows --parallel 3

      - name: Verify qualification test registration
        run: cmake -DBUILD_DIR=build/ci-windows -DCTEST_CONFIGURATION=RelWithDebInfo -P tests/cmake/CheckQualificationTestRegistration.cmake

      - name: Run qualification diff contract tests
        run: ctest --preset ci-windows -R '^qualification_diff_' --output-on-failure --no-tests=error

      - name: Run non-GPU tests
        run: ctest --preset ci-windows

  macos:
    name: macOS build and tests
    needs: windows
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/package-environment-macos.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash
      - name: Configure
        run: cmake --preset ci -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build and check formatting
        run: |
          cmake --build --preset ci --parallel 3
          cmake --build --preset ci --target format-check
      - name: Verify qualification registration and execute all seven cases
        run: |
          cmake -DBUILD_DIR=build/ci -DCTEST_CONFIGURATION=Debug -P tests/cmake/CheckQualificationTestRegistration.cmake
          ctest --preset ci -R '^qualification_diff_' --output-on-failure --no-tests=error
      - name: Run non-GPU tests
        run: ctest --preset ci --output-on-failure --no-tests=error

  linux-validation:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-tidy, asan-ubsan, tsan]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/validation-environment-linux.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash
      - name: Configure supported TSan address layout
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -G Ninja
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3
      - name: Verify qualification registration and execute all seven cases
        run: |
          cmake -DBUILD_DIR=build/${{ matrix.preset }} -DCTEST_CONFIGURATION=Debug -P tests/cmake/CheckQualificationTestRegistration.cmake
          ctest --preset ${{ matrix.preset }} -R '^qualification_diff_' --output-on-failure --no-tests=error
      - name: Run non-GPU tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.preset }}-logs
          path: build/${{ matrix.preset }}/Testing/Temporary/
