  windows:
    name: Windows build and tests
#    needs: linux
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source and test dependencies
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: powershell

      - name: Configure and build with MSVC
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installationPath) {
            throw "A Visual Studio installation with the MSVC x64 tools was not found."
          }

          $devShell = Join-Path $installationPath "Common7\Tools\Launch-VsDevShell.ps1"
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $env:CXX = "cl.exe"
          cmake --preset ci -G Ninja
          cmake --build --preset ci --parallel 3

      - name: Run non-GPU tests
        run: ctest --preset ci
